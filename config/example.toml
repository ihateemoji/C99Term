[window]
opacity = 0.85
decorations = "None"
dynamic_padding = true
startup_mode = "Windowed"
title = "C99Term"
padding = { x = 8, y = 4 }

[window.dimensions]
columns = 100
lines = 30

[window.position]
x = 40
y = 40

[scrolling]
history = 20000
multiplier = 5

[font]
size = 13.0

[font.normal]
family = "monospace"
style = "Regular"

[colors.primary]
background = "#1d2021"
foreground = "#d5c4a1"

[colors.normal]
black = "#282828"
red = "#cc241d"

[cursor]
style = { shape = "Beam", blinking = "Off" }

[selection]
save_to_clipboard = true

[terminal]
shell = { program = "/bin/sh", args = ["-l"] }
