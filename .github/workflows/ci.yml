name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libx11-dev libxft-dev libxrender-dev libfontconfig1-dev
      - name: Build
        run: make
      - name: Test
        run: make test

  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y gmake pkgconf libX11 libXft libXrender fontconfig
          run: |
            gmake CC=cc
            gmake CC=cc test
